				/**
				 * 加个 undefined”是为了覆盖“未显式设置 domain 的主机级 cookie
				 */
				function getRootDomain(hostname) {
					if (!hostname || hostname === 'localhost' || /^\d+\.\d+\.\d+\.\d+$/.test(hostname)) return hostname
					const parts = hostname.split('.')
					if (parts.length <= 2) return hostname
					return parts.slice(-2).join('.')
				}
	
				function setExpiredCookie(name, domain, path) {
					const segments = []
					segments.push(name + '=')
					segments.push('Max-Age=0')
					if (path) segments.push('Path=' + path)
					if (domain) segments.push('Domain=' + domain)
					document.cookie = segments.join('; ')
				}
	
				function removeCookieEverywhere(name) {
					const hostname = typeof window !== 'undefined' ? window.location.hostname : undefined
					const root = hostname ? getRootDomain(hostname) : undefined
					const domains = []
					// if (hostname) domains.push(hostname)
					if (root && root !== hostname) domains.push('.' + root)
					const paths = ['/']
					domains.forEach((domain) => {
						paths.forEach((path) => {
						try {
							setExpiredCookie(name, domain, path)
						} catch (_) {
							// ignore
							console.log('err', _)
						}
						})
					})
				}
	
				function removeCookiesByPrefix(prefix) {
					if (typeof document === 'undefined') return
					const all = document.cookie ? document.cookie.split('; ') : []
					all.forEach((kv) => {
						const eqIdx = kv.indexOf('=')
						const key = eqIdx === -1 ? kv : kv.slice(0, eqIdx)
						if (key.startsWith(prefix)) removeCookieEverywhere(key)
					})
				}
