<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gtracking - 运单查询助手</title>
    <link rel="stylesheet" href="style.css?v=3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar / Config -->
        <aside class="sidebar">
            <div class="logo">
                <span class="logo-icon">G</span>
                <h1>Gtracking</h1>
            </div>
            
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item active">🏠 轨迹查询</a>
                <a href="bagging_check.html" class="nav-item">📦 错分检查</a>
            </nav>

            <div class="config-panel">
                <!-- DMS Login Segment -->
                <div class="config-section dms-login-section">
                    <h3>
                        <span>🔐</span> DMS 快捷登录
                    </h3>
                    <div id="dms-login-form" class="dms-login-form">
                        <div class="input-group">
                            <label for="dms-phone">手机号</label>
                            <input type="text" id="dms-phone" placeholder="手机号 / 账号...">
                        </div>
                        <div class="input-group">
                            <label for="dms-pwd">密码</label>
                            <input type="password" id="dms-pwd" placeholder="密码...">
                        </div>
                        <div class="input-group">
                            <label for="dms-captcha">验证码</label>
                            <div class="captcha-container-wrapper">
                                <input type="text" id="dms-captcha" placeholder="验证码...">
                                <div id="dms-captcha-container" class="captcha-img-container" title="点击刷新验证码">
                                    <img id="dms-captcha-img" src="" alt="验证码" class="hidden">
                                    <span id="dms-captcha-loading" class="loader"></span>
                                </div>
                            </div>
                        </div>
                        <button id="dms-login-btn" class="btn-primary dms-login-btn">
                            <span class="btn-text">一键登录并保存</span>
                            <span class="loader hidden"></span>
                        </button>
                    </div>
                </div>

                <!-- Manual Configuration -->
                <div class="config-section manual-config-section">
                    <h3>
                        <span>⚙️</span> 手动配置
                    </h3>
                    <div class="input-group">
                        <label for="proxy-url">代理服务器地址 (Netlify/静态部署必填)</label>
                        <input type="text" id="proxy-url" placeholder="例如 http://您的服务器IP:7000">
                    </div>
                    <div class="input-group">
                        <label for="token">Admin-Token</label>
                        <input type="password" id="token" placeholder="输入您的 Token...">
                    </div>

                    <button id="save-config" class="btn-secondary">保存配置</button>
                </div>

                <div class="stats-panel sidebar-stats-divider">
                    <div class="stat-item">
                        <span class="stat-label">今日查询</span>
                        <span class="stat-value" id="today-queries">0</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <h2>轨迹查询仪表盘</h2>
                <div class="top-bar-right">
                    <button id="theme-toggle" class="theme-toggle-btn" title="切换主题">
                        <span class="theme-icon">🌙</span>
                    </button>
                    <div class="user-info">
                        <span id="current-time"></span>
                    </div>
                </div>
            </header>

             <section class="search-section">
                <div class="search-card card">
                    <div class="search-inputs">
                        <div class="textarea-wrapper">
                            <textarea id="order-nos" placeholder="输入单号，多个请换行..."></textarea>
                            <button id="scan-btn" class="btn-scan" title="扫描条形码/二维码">
                                📷
                            </button>
                        </div>
                        <div class="search-actions">
                            <select id="query-type" title="查询类型">
                                <option value="1">面单号</option>
                                <option value="2">第三方订单号</option>
                                <option value="3">第三方单号</option>
                            </select>
                            <button id="search-btn" class="btn-primary">
                                <span class="btn-text">立即查询</span>
                                <span class="loader hidden"></span>
                            </button>
                            <button id="export-btn" class="btn-secondary hidden" title="导出查询结果为 CSV">
                                <span>📤</span> 导出结果
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <section class="results-section">
                <div id="results-container" class="results-grid">
                    <!-- Results will be injected here -->
                    <div class="empty-state">
                        <img src="https://img.icons8.com/fluency/96/delivery.png" alt="box">
                        <p>等待查询，请输入运单号开始</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal for Detail -->
    <div id="detail-modal" class="modal hidden">
        <div class="modal-content card">
            <header class="modal-header">
                <h3>运单轨迹详情</h3>
                <button class="close-modal">&times;</button>
            </header>
            <div class="modal-body">
                <div id="timeline" class="timeline"></div>
            </div>
        </div>
    </div>

    <!-- Modal for 17Track Detail -->
    <div id="yq-modal" class="modal hidden">
        <div class="modal-content card yq-modal-content">
            <header class="modal-header">
                <div class="modal-logo-wrapper">
                    <span class="logo-icon yq-logo-icon">17</span>
                    <h3 id="yq-modal-title">17TRACK 派送查询</h3>
                </div>
                <div class="modal-actions-wrapper">
                    <a id="yq-external-link" href="#" target="_blank" class="btn-secondary yq-external-btn">在新窗口打开</a>
                    <button class="close-modal" id="close-yq-modal">&times;</button>
                </div>
            </header>
            <div class="modal-body yq-modal-body">
                <div id="YQContainer"></div>
            </div>
        </div>
    </div>

    <!-- Modal for Center Pack (袋牌号) Detail -->
    <div id="pack-modal" class="modal hidden">
        <div class="modal-content card pack-modal-content">
            <header class="modal-header">
                <h3 id="pack-modal-title">集包记录</h3>
                <button class="close-modal" id="close-pack-modal" type="button">&times;</button>
            </header>
            <div class="modal-body pack-modal-body" id="pack-modal-body">
                <div class="pack-loading">正在加载集包记录...</div>
            </div>
        </div>
    </div>

    <!-- Modal for Barcode/QR Code Scanner -->
    <div id="scan-modal" class="modal hidden">
        <div class="modal-content card scan-modal-content">
            <header class="modal-header">
                <h3>📷 扫码输入单号</h3>
                <button class="close-modal" id="close-scan-modal">&times;</button>
            </header>
            <div class="modal-body scan-modal-body">
                <div id="reader"></div>
                <div id="scan-feedback">
                    请将运单条形码/二维码放入框内以自动扫描
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="https://unpkg.com/html5-qrcode"></script>
    <script type="text/javascript" src="https://www.17track.net/externalcall.js"></script>
    <script src="script.js?v=18"></script>
</body>
</html>
